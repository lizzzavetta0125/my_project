<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinMate — учёт финансов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark material-symbols-outlined">account_balance_wallet</span>
          <div>
            <strong>FinMate</strong>
            <small>личный бюджет</small>
          </div>
        </div>
        <nav>
          <button class="nav-btn active" data-page="dashboard">
            <span class="material-symbols-outlined">dashboard</span>
            Дашборд
          </button>
          <button class="nav-btn" data-page="transactions">
            <span class="material-symbols-outlined">receipt_long</span>
            Операции
          </button>
          <button class="nav-btn" data-page="budgets">
            <span class="material-symbols-outlined">pie_chart</span>
            Бюджеты
          </button>
          <button class="nav-btn" data-page="reports">
            <span class="material-symbols-outlined">monitoring</span>
            Отчёты
          </button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <h1 id="page-title">Дашборд</h1>
            <p id="page-subtitle">Сводка за сентябрь 2026</p>
          </div>
          <button class="btn filled" id="open-tx-dialog">
            <span class="material-symbols-outlined">add</span>
            Операция
          </button>
        </header>

        <section id="page-dashboard" class="page active"></section>
        <section id="page-transactions" class="page"></section>
        <section id="page-budgets" class="page"></section>
        <section id="page-reports" class="page"></section>
      </main>
    </div>

    <dialog id="tx-dialog" class="sheet">
      <form id="tx-form" method="dialog">
        <h2>Новая операция</h2>
        <label>
          Тип
          <select name="type" id="tx-type" required>
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </label>
        <label>
          Категория
          <select name="categoryId" id="tx-category" required></select>
        </label>
        <label>
          Сумма, ₽
          <input name="amount" type="number" min="1" step="1" required />
        </label>
        <label>
          Комментарий
          <input name="note" type="text" placeholder="Например, обед" />
        </label>
        <div class="dialog-actions">
          <button type="button" class="btn text" id="close-tx-dialog">Отмена</button>
          <button type="submit" class="btn filled">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog id="budget-dialog" class="sheet">
      <form id="budget-form" method="dialog">
        <h2>Лимит категории</h2>
        <label>
          Категория
          <select name="categoryId" id="budget-category" required></select>
        </label>
        <label>
          Лимит в месяц, ₽
          <input name="limit" type="number" min="1" step="1" required />
        </label>
        <div class="dialog-actions">
          <button type="button" class="btn text" id="close-budget-dialog">Отмена</button>
          <button type="submit" class="btn filled">Сохранить</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/js/app.js"></script>
  </body>
</html>
